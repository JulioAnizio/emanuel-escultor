<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <base href="/emanuel-escultor/en/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Private Collections | Restricted Access — Emanuel Nunes</title>
    <meta name="description" content="Exclusive access to the restricted catalog of luxury sculptures for private collectors and high-end architecture. Request access credentials.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://emanuelnunes.pt/en/private-collections.html">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Playfair+Display:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS BASE DE ALTO PADRÃO --- */
        :root {
            --preto-luxo: #050505;
            --preto-suave: #0f0f0f;
            --prata-escovado: #b5b5b7;
            --dourado-brilhante: #d4af37;
            --ouro-envelhecido: #8c7333;
            --branco-puro: #ffffff;
            
            --fonte-titulo: 'Playfair Display', serif;
            --fonte-corpo: 'Montserrat', sans-serif;
            --transicao-seda: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--preto-luxo);
            color: var(--prata-escovado);
            font-family: var(--fonte-corpo);
            font-weight: 300;
            line-height: 1.8;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: var(--fonte-titulo);
            font-weight: 300;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--branco-puro);
        }

        /* --- LAYOUT DA PÁGINA PRIVADA --- */
        .private-container {
            min-height: 85vh;
            padding: 180px 8% 80px 8%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .private-content {
            max-width: 650px;
            text-align: center;
            background: var(--preto-suave);
            border: 1px solid rgba(140, 115, 51, 0.15);
            padding: 60px 50px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        .icon-lock {
            font-size: 2rem;
            color: var(--ouro-envelhecido);
            margin-bottom: 25px;
            display: block;
        }

        .private-content h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .private-content p {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        /* Form Estilizado */
        .private-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--ouro-envelhecido);
        }

        .lux-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #222;
            padding: 12px 5px;
            color: var(--branco-puro);
            font-family: var(--fonte-corpo);
            font-size: 0.9rem;
            transition: var(--transicao-seda);
        }

        .lux-input:focus {
            outline: none;
            border-bottom: 1px solid var(--dourado-brilhante);
        }

        .btn-premium {
            display: inline-block;
            padding: 16px 40px;
            border: 1px solid var(--ouro-envelhecido);
            color: var(--ouro-envelhecido);
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: var(--transicao-seda);
            background: transparent;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }

        .btn-premium:hover {
            background-color: var(--ouro-envelhecido);
            color: var(--preto-luxo);
            box-shadow: 0 0 25px rgba(140, 115, 51, 0.25);
        }

        @media (max-width: 768px) {
            .private-container { padding: 140px 5% 60px 5%; }
            .private-content { padding: 40px 25px; }
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="private-container">
        <section class="private-content">
            <span class="icon-lock">✦</span>
            <h1>Restricted Portfolio</h1>
            <p>Viewing signature masterworks created for private collections and luxury residential projects requires credential verification or a formal invitation.</p>
            
            <form class="private-form" action="mailto:atelie.emanuelnunes@gmail.com" method="POST" enctype="text/plain">
                <div class="form-group">
                    <label for="solicitante">Collector Name / Architecture Firm</label>
                    <input type="text" id="solicitante" name="Collector-Name" class="lux-input" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="credencial">Access Code or NDA (If applicable)</label>
                    <input type="text" id="credencial" name="Access-Code" class="lux-input" placeholder="Optional" autocomplete="off">
                </div>

                <button type="submit" class="btn-premium">Request Access Key</button>
            </form>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/main.js"></script>
</body>
</html>
