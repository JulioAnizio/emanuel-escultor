    <style>
        :root {
            --preto-luxo: #050505;
            --preto-suave: #0f0f0f;
            --prata-escovado: #b5b5b7;
            --dourado-brilhante: #d4af37;
            --ouro-envelhecido: #8c7333;
            --branco-puro: #ffffff;
            --fonte-titulo: 'Playfair Display', serif;
            --fonte-corpo: 'Montserrat', sans-serif;
            --transicao-seda: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--preto-luxo);
            color: var(--prata-escovado);
            font-family: var(--fonte-corpo);
            font-weight: 300;
            line-height: 1.8;
            overflow-x: hidden;
        }

        h1, h2 {
            font-family: var(--fonte-titulo);
            font-weight: 300;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--branco-puro);
        }

        /* HEADER DA PÁGINA */
        .videos-header {
            padding: 160px 8% 60px 8%;
            text-align: center;
        }

        .videos-header h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .videos-header p {
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--ouro-envelhecido);
            margin-bottom: 40px;
        }

        .btn-canal {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 36px;
            border: 1px solid var(--ouro-envelhecido);
            color: var(--ouro-envelhecido);
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: var(--transicao-seda);
        }

        .btn-canal:hover {
            background-color: var(--ouro-envelhecido);
            color: var(--preto-luxo);
        }

        .btn-canal svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* GRID DE VÍDEOS */
        .videos-grid {
            padding: 20px 8% 120px 8%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
        }

        .video-item {
            background-color: var(--preto-suave);
            border: 1px solid rgba(255,255,255,0.03);
            overflow: hidden;
            transition: var(--transicao-seda);
            text-decoration: none;
            display: block;
        }

        .video-item:hover {
            border-color: rgba(140, 115, 51, 0.3);
        }

        .video-thumb {
            position: relative;
            width: 100%;
            padding-bottom: 177.78%; /* 9:16 para Shorts */
            background: #000;
            overflow: hidden;
        }

        .video-thumb img {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.75;
            transition: transform 1.2s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.6s ease;
        }

        .video-item:hover .video-thumb img {
            transform: scale(1.04);
            opacity: 0.95;
        }

        .play-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease, transform 0.3s ease;
            z-index: 2;
        }

        .video-item:hover .play-btn {
            background: rgba(212, 175, 55, 1);
            transform: translate(-50%, -50%) scale(1.1);
        }

        .play-btn svg {
            width: 24px;
            height: 24px;
            fill: #050505;
            margin-left: 4px;
        }

        .video-info {
            padding: 20px;
        }

        .video-info h2 {
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 6px;
            color: var(--branco-puro);
        }

        .video-info span {
            font-size: 0.68rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--ouro-envelhecido);
        }

        /* RESPONSIVIDADE */
        @media (max-width: 1024px) {
            .videos-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .videos-grid {
                grid-template-columns: 1fr;
                padding: 20px 5% 80px 5%;
            }
        }
    </style>
</head>
